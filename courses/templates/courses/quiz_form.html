<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Quiz</title>
</head>
<body>
    <h1>Create quiz for {{ course.title }}</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save quiz</button>
    </form>

    <p><a href="{{ course.get_absolute_url }}">Back to course</a></p>
</body>
</html>
