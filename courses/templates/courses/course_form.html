<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Course</title>
</head>
<body>
    <h1>Create a new course</h1>

    {% if user.is_authenticated %}
        <p>Logged in as {{ user.username }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
    </form>

    <p><a href="{% url 'course_list' %}">Back to all courses</a></p>
</body>
</html>
